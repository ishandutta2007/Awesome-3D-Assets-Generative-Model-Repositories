<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 20px); opacity: 0.6; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.25) translate(25px, -15px); opacity: 0.55; }
    }
    @keyframes floatCube {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes wireframeRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(450px); opacity: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 150px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 250px; }
    .floating-mesh { animation: floatCube 7s ease-in-out infinite; transform-origin: center; }
    .rotating-ring { animation: wireframeRotate 24s linear infinite; transform-origin: 1050px 210px; }
    .scan-beam { animation: scanline 6s ease-in-out infinite; }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Grid Perspective Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="220" cy="130" r="140" fill="#38bdf8" />
    <circle class="orb-2" cx="1020" cy="230" r="170" fill="#8b5cf6" />
    <circle cx="600" cy="380" r="160" fill="#ec4899" opacity="0.15" />
  </g>

  <!-- Ambient Scanning Horizon Line -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#38bdf8" stroke-opacity="0.08" stroke-dasharray="8 8" />

  <!-- Dynamic 3D Geometric Wireframe Graphic (Right Side - Behind text margin) -->
  <g class="rotating-ring" opacity="0.25">
    <ellipse cx="1050" cy="210" rx="140" ry="60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 6" />
    <ellipse cx="1050" cy="210" rx="60" ry="140" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="8 4" />
    <circle cx="1050" cy="210" r="150" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
  </g>

  <g class="floating-mesh">
    <!-- Isometric 3D Wireframe Cube / Polyhedron Accent -->
    <g transform="translate(980, 140)" opacity="0.85">
      <!-- Polyhedron Vertices & Lines -->
      <polygon points="70,0 140,40 140,120 70,160 0,120 0,40" fill="url(#meshGrad)" stroke="#67e8f9" stroke-width="1.5" stroke-linejoin="round" />
      <line x1="70" y1="0" x2="70" y2="80" stroke="#a5f3fc" stroke-width="1.2" />
      <line x1="140" y1="40" x2="70" y2="80" stroke="#a5f3fc" stroke-width="1.2" />
      <line x1="0" y1="40" x2="70" y2="80" stroke="#a5f3fc" stroke-width="1.2" />
      <line x1="70" y1="80" x2="70" y2="160" stroke="#c084fc" stroke-width="1.2" />
      <!-- Small Glow nodes -->
      <circle cx="70" cy="0" r="3" fill="#ffffff" filter="url(#subtleGlow)" />
      <circle cx="140" cy="40" r="3" fill="#ffffff" />
      <circle cx="140" cy="120" r="3" fill="#ffffff" />
      <circle cx="70" cy="160" r="3" fill="#ffffff" />
      <circle cx="0" cy="120" r="3" fill="#ffffff" />
      <circle cx="0" cy="40" r="3" fill="#ffffff" />
      <circle cx="70" cy="80" r="4" fill="#38bdf8" filter="url(#subtleGlow)" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Safe from overlap -->
  <g transform="translate(80, 0)">
    
    <!-- Top Category Pill / Micro-Badge -->
    <g transform="translate(0, 62)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="15" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED 3D ECOSYSTEM</text>
    </g>

    <!-- Main Title (Strictly Foregrounded & High Contrast) -->
    <text x="0" y="152" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Awesome 3D Assets &amp; Generative AI
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
      Model Repositories, Marketplaces, Open-Source Pipelines &amp; Neural 3D Models
    </text>

    <!-- Description Tagline -->
    <text x="0" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400">
      Tracking commercial SaaS platforms, 10M+ open 3D asset registries, and state-of-the-art text/image-to-3D diffusion engines.
    </text>

    <!-- Feature Attribute Cards / Badges in Foreground -->
    <g transform="translate(0, 276)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="54" rx="10" fill="url(#badgeGrad1)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4" />
        <text x="16" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">3D ASSETS &amp; PBR</text>
        <text x="16" y="42" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">CC0, glTF, USDZ, Meshes</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(195, 0)">
        <rect width="210" height="54" rx="10" fill="url(#badgeGrad2)" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4" />
        <text x="16" y="24" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">GENERATIVE 3D AI</text>
        <text x="16" y="42" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">DiT, SLAT, NeRF &amp; Gaussian Splats</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(420, 0)">
        <rect width="210" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="16" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">OPEN-SOURCE &amp; SAAS</text>
        <text x="16" y="42" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Free Tiers, Pricing &amp; Benchmarks</text>
      </g>
    </g>

    <!-- Bottom Metadata Details -->
    <text x="0" y="380" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      ⚡ Actively Maintained &amp; Updated • Curated by Ishan Dutta • Contributions Welcome
    </text>
  </g>

  <!-- Framing Border -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="0" fill="none" stroke="#1e293b" stroke-width="1" />
</svg>
