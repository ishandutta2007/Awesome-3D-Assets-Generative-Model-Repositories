) translate(25px,-15px);opacity:.55}}@keyframes floatCube{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(3deg)}}@keyframes wireframeRotate{0%{transform:rotate(0deg)}}@keyframes scanline{0%{transform:translateY(-100px);opacity:0}50%{opacity:.5}}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 150px}.orb-2{animation:pulseOrb2 10s ease-in-out infinite;transform-origin:1000px 250px}.floating-mesh{animation:floatCube 7s ease-in-out infinite;transform-origin:center}.rotating-ring{animation:wireframeRotate 24s linear infinite;transform-origin:1050px 210px}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><g filter="url(#glow)"><circle cx="220" cy="130" r="140" fill="#38bdf8" class="orb-1"/><circle cx="1020" cy="230" r="170" fill="#8b5cf6" class="orb-2"/><circle cx="600" cy="380" r="160" fill="#ec4899" opacity=".15"/></g><line x1="0" x2="1200" y1="210" y2="210" stroke="#38bdf8" stroke-dasharray="8 8" stroke-opacity=".08"/><g class="rotating-ring" opacity=".25"><ellipse cx="1050" cy="210" fill="none" stroke="#38bdf8" stroke-dasharray="10 6" stroke-width="1.5" rx="140" ry="60"/><ellipse cx="1050" cy="210" fill="none" stroke="#c084fc" stroke-dasharray="8 4" stroke-width="1.5" rx="60" ry="140"/><circle cx="1050" cy="210" r="150" fill="none" stroke="#818cf8" stroke-opacity=".4" stroke-width="1"/></g><g class="floating-mesh"><g opacity=".85" transform="translate(980, 140)"><polygon fill="url(#meshGrad)" stroke="#67e8f9" stroke-linejoin="round" stroke-width="1.5" points="70 0 140 40 140 120 70 160 0 120 0 40"/><line x1="70" x2="70" y1="0" y2="80" stroke="#a5f3fc" stroke-width="1.2"/><line x1="140" x2="70" y1="40" y2="80" stroke="#a5f3fc" stroke-width="1.2"/><line x1="0" x2="70" y1="40" y2="80" stroke="#a5f3fc" stroke-width="1.2"/><line x1="70" x2="70" y1="80" y2="160" stroke="#c084fc" stroke-width="1.2"/><circle cx="70" cy="0" r="3" fill="#fff" filter="url(#subtleGlow)"/><circle cx="140" cy="40" r="3" fill="#fff"/><circle cx="140" cy="120" r="3" fill="#fff"/><circle cx="70" cy="160" r="3" fill="#fff"/><circle cx="0" cy="120" r="3" fill="#fff"/><circle cx="0" cy="40" r="3" fill="#fff"/><circle cx="70" cy="80" r="4" fill="#38bdf8" filter="url(#subtleGlow)"/></g></g><g><g transform="translate(80, 0) translate(0, 62)"><rect width="260" height="30" fill="#1e293b" stroke="#334155" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="32" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED 3D ECOSYSTEM</text></g><text x="0" y="152" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1" transform="translate(80, 0)">Awesome 3D Assets &amp; Generative AI</text><text x="0" y="200" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" transform="translate(80, 0)">Model Repositories, Marketplaces, Open-Source Pipelines &amp; Neural 3D Models</text><text x="0" y="238" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" transform="translate(80, 0)">Tracking commercial SaaS platforms, 10M+ open 3D asset registries, and state-of-the-art text/image-to-3D diffusion engines.</text><g><g transform="translate(80, 0) translate(0, 276) translate(0, 0)"><rect width="180" height="54" fill="url(#badgeGrad1)" stroke="#0284c7" stroke-opacity=".4" stroke-width="1" rx="10"/><text x="16" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font